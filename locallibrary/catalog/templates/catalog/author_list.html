{% extends "base_generic.html" %}

{% block content %}
    <h1>Author list</h1>
    {% if author_list %}
        <ul style="display: flex; flex-direction: column; gap: 10px">
            {% for author in author_list %}
                <li>
                    <a href="{{ author.get_absolute_url }}">{{ author.first_name}}, {{ author.last_name }}</a>
                </li>
            {% endfor %}
        </ul>
    {% endif %}
{% endblock %}
